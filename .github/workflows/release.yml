# A self-building release on every version tag (git tag v1.0 && git push
# origin v1.0): the launcher, the toolkit's pipeline, a pinned compiler and
# this repository's sources, as gladius-<tag>-linux-x86_64.tar.xz,
# gladius-<tag>-macos-arm64.tar.xz and gladius-<tag>-windows-x86_64.zip on the tag's
# GitHub release. The player
# points the launcher at their own copy of the game (the disc's files, or a
# hard-drive copy's) and it builds the game on their machine
# (DirectXbox-Recomp's docs/technical/self-build-release.md; release/gladius.json
# here, which names gladius_eng.xbe as the XBE to build: the disc's
# default.xbe only picks a language).
#
# No game files are involved anywhere: the release holds no lifted code and
# nothing here lifts, builds or starts the game.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (a dry run: nothing is published)"
        default: "dev"
      sign:
        description: "Sign the APK with the release key, so it installs over a release (off: a throwaway key)"
        type: boolean
        default: true

permissions:
  contents: write

env:
  VERSION: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
  # The toolkit this repository builds against (README.md): a branch, tag or
  # commit of DirectXbox-Recomp.
  TOOLKIT_REF: main

jobs:
  linux:
    name: Linux x86-64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: gladius

      # The toolkit beside this repository, where CMakeLists.txt and
      # scripts/build.py look for it, and of its submodules only what the
      # release builds.
      - uses: actions/checkout@v4
        with:
          repository: phobos665/DirectXbox-Recomp
          ref: ${{ env.TOOLKIT_REF }}
          path: DirectXbox-Recomp
      - name: Fetch the toolkit's submodules
        working-directory: DirectXbox-Recomp
        run: |
          git submodule update --init --depth 1 \
            third_party/SDL third_party/Vulkan-Headers \
            third_party/volk third_party/VulkanMemoryAllocator \
            third_party/libsamplerate third_party/miniupnp
          git submodule update --init --recursive --depth 1 third_party/XbSymbolDatabase

      # The release's zig compiles against its own glibc headers; these are
      # what SDL loads at run time, searched after them.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxss-dev libxfixes-dev libxtst-dev libxkbcommon-dev \
            libwayland-dev wayland-protocols libegl-dev libdrm-dev libgbm-dev \
            libpulse-dev libasound2-dev libudev-dev \
            libfreetype-dev libfontconfig-dev

      - name: Fetch DXC
        run: bash DirectXbox-Recomp/tools/linux/fetch_dxc.sh

      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/downloads
          key: release-downloads-${{ hashFiles('DirectXbox-Recomp/tools/release/fetch_toolchain.py') }}

      - name: Make the release
        working-directory: DirectXbox-Recomp
        run: |
          python3 -m tools.release.make_release ../gladius/release/gladius.json \
            --out "$RUNNER_TEMP/release/gladius" --work "$RUNNER_TEMP/work" \
            --cache "$RUNNER_TEMP/downloads" --version "$VERSION" --archive

      - uses: actions/upload-artifact@v4
        with:
          name: gladius-${{ env.VERSION }}-linux-x86_64
          path: ${{ runner.temp }}/release/*.tar.xz
          retention-days: 3

  # An application, Gladius.app, for Apple Silicon. The player needs
  # no Xcode: zig builds the game. SDL and the launcher are built here with
  # Xcode, and the Vulkan loader, MoltenVK and DXC come from LunarG's SDK.
  macos:
    name: macOS arm64
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          path: gladius

      - uses: actions/checkout@v4
        with:
          repository: phobos665/DirectXbox-Recomp
          ref: ${{ env.TOOLKIT_REF }}
          path: DirectXbox-Recomp
      - name: Fetch the toolkit's submodules
        working-directory: DirectXbox-Recomp
        run: |
          git submodule update --init --depth 1 \
            third_party/SDL third_party/Vulkan-Headers \
            third_party/volk third_party/VulkanMemoryAllocator \
            third_party/libsamplerate third_party/miniupnp
          git submodule update --init --recursive --depth 1 third_party/XbSymbolDatabase

      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/vulkan-sdk-downloads
          key: vulkan-sdk-${{ hashFiles('DirectXbox-Recomp/tools/macos/fetch_vulkan_sdk.sh') }}

      - name: Fetch the Vulkan SDK
        run: |
          bash DirectXbox-Recomp/tools/macos/fetch_vulkan_sdk.sh "$RUNNER_TEMP/VulkanSDK" \
            "$RUNNER_TEMP/vulkan-sdk-downloads" >> "$GITHUB_ENV"

      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/downloads
          key: release-downloads-macos-${{ hashFiles('DirectXbox-Recomp/tools/release/fetch_toolchain.py') }}

      - name: Make the release
        working-directory: DirectXbox-Recomp
        run: |
          python3 -m tools.release.make_release ../gladius/release/gladius.json \
            --out "$RUNNER_TEMP/release/gladius" --work "$RUNNER_TEMP/work" \
            --cache "$RUNNER_TEMP/downloads" --version "$VERSION" --archive

      - uses: actions/upload-artifact@v4
        with:
          name: gladius-${{ env.VERSION }}-macos-arm64
          path: ${{ runner.temp }}/release/*.tar.xz
          retention-days: 3

  # A folder with gladius.exe, for 64-bit Windows 10 or 11. The player needs no
  # Visual Studio: zig builds the game for MinGW against Windows' own DLLs.
  windows:
    name: Windows x86-64
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          path: gladius

      - uses: actions/checkout@v4
        with:
          repository: phobos665/DirectXbox-Recomp
          ref: ${{ env.TOOLKIT_REF }}
          path: DirectXbox-Recomp
      - name: Fetch the toolkit's submodules
        working-directory: DirectXbox-Recomp
        run: |
          git submodule update --init --depth 1 \
            third_party/SDL third_party/Vulkan-Headers \
            third_party/volk third_party/VulkanMemoryAllocator \
            third_party/libsamplerate third_party/miniupnp
          git submodule update --init --recursive --depth 1 third_party/XbSymbolDatabase

      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/downloads
          key: release-downloads-windows-${{ hashFiles('DirectXbox-Recomp/tools/release/fetch_toolchain.py', 'DirectXbox-Recomp/tools/release/zigwrap.c') }}

      - name: Make the release
        working-directory: DirectXbox-Recomp
        run: |
          python -m tools.release.make_release ../gladius/release/gladius.json \
            --out "$RUNNER_TEMP/release/gladius" --work "$RUNNER_TEMP/work" \
            --cache "$RUNNER_TEMP/downloads" --version "$VERSION" --archive

      - uses: actions/upload-artifact@v4
        with:
          name: gladius-${{ env.VERSION }}-windows-x86_64
          path: ${{ runner.temp }}/release/*.zip
          retention-days: 3

  # An APK for arm64 Android handhelds (Android 11 or later, a Vulkan GPU).
  # Like the other releases it holds no game code: on first launch the
  # player picks their disc or folder and the app recompiles the game on the
  # device (DirectXbox-Recomp's docs/technical/android.md). Package name and
  # label come from the recipe's "android" section. Signed with the release
  # key in the ANDROID_SIGNING_KEY / ANDROID_SIGNING_PASSWORD secrets, so
  # each release installs over the last.
  android:
    name: Android arm64
    runs-on: ubuntu-24.04
    env:
      NDK_VERSION: 27.3.13750724
    steps:
      - uses: actions/checkout@v4
        with:
          path: gladius

      - uses: actions/checkout@v4
        with:
          repository: phobos665/DirectXbox-Recomp
          ref: ${{ env.TOOLKIT_REF }}
          path: DirectXbox-Recomp
      - name: Fetch the toolkit's submodules
        working-directory: DirectXbox-Recomp
        run: |
          git submodule update --init --depth 1 \
            third_party/SDL third_party/Vulkan-Headers \
            third_party/volk third_party/VulkanMemoryAllocator \
            third_party/libsamplerate third_party/miniupnp
          git submodule update --init --recursive --depth 1 third_party/XbSymbolDatabase

      # A tag's APK must carry the release key: one signed with a throwaway
      # key would not install over the last release. So must a dry run's
      # when it is asked to be signed (the default), to test the whole flow.
      - name: Check the signing key
        if: github.event_name == 'push' || inputs.sign
        env:
          ANDROID_SIGNING_KEY: ${{ secrets.ANDROID_SIGNING_KEY }}
          ANDROID_SIGNING_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
        run: |
          if [ -z "$ANDROID_SIGNING_KEY" ] || [ -z "$ANDROID_SIGNING_PASSWORD" ]; then
            echo "ANDROID_SIGNING_KEY and ANDROID_SIGNING_PASSWORD must be set for a release" >&2
            exit 1
          fi

      - name: Install the NDK
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;$NDK_VERSION" "build-tools;35.0.0" "platforms;android-35" >/dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      # Python, zig and Capstone for the device, and DXC built for Android
      # (an LLVM build: long the first time, so the results are kept).
      - uses: actions/cache@v4
        with:
          path: DirectXbox-Recomp/third_party/android
          key: android-deps-${{ env.NDK_VERSION }}-${{ hashFiles('DirectXbox-Recomp/tools/android/fetch_deps.py', 'DirectXbox-Recomp/tools/android/build_dxc.sh') }}

      - name: Fetch the device's toolchain
        run: |
          python3 DirectXbox-Recomp/tools/android/fetch_deps.py
          # Only the results are kept: the sources and build trees are GBs.
          rm -rf DirectXbox-Recomp/third_party/android/dxc-src \
            DirectXbox-Recomp/third_party/android/dxc-build \
            DirectXbox-Recomp/third_party/android/capstone/src \
            DirectXbox-Recomp/third_party/android/capstone/build

      # Without the key, make_apk signs with a key of its own.
      - name: Make the APK
        env:
          ANDROID_SIGNING_KEY: ${{ (github.event_name == 'push' || inputs.sign) && secrets.ANDROID_SIGNING_KEY || '' }}
          ANDROID_SIGNING_PASSWORD: ${{ (github.event_name == 'push' || inputs.sign) && secrets.ANDROID_SIGNING_PASSWORD || '' }}
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          read -r PACKAGE LABEL < <(python3 -c 'import json; a = json.load(open("gladius/release/gladius.json"))["android"]; print(a["package"], a["label"])')
          python3 DirectXbox-Recomp/tools/android/build_apk.py --project gladius \
            --recipe gladius/release/gladius.json --package "$PACKAGE" --label "$LABEL" \
            --version-code "${{ github.run_number }}" --version-name "$VERSION" \
            --out "$RUNNER_TEMP/release/gladius-$VERSION-android-arm64.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: gladius-${{ env.VERSION }}-android-arm64
          path: ${{ runner.temp }}/release/*.apk
          retention-days: 3

  # One job publishes, once all are built, so a tag never gets half a release.
  publish:
    name: Publish
    if: github.event_name == 'push'
    needs: [linux, macos, windows, android]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: archives
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -l archives
          gh release view "$VERSION" >/dev/null 2>&1 || \
            gh release create "$VERSION" --title "$VERSION" --verify-tag \
              --notes "Point the launcher at your own copy of Gladius (the English release: the disc's files, a disc image, or a hard-drive copy) and it builds the game on your machine, once. Linux: unpack gladius-$VERSION-linux-x86_64.tar.xz and run ./gladius. Windows (64-bit, 10 or 11): unzip gladius-$VERSION-windows-x86_64.zip and run gladius.exe (it is not signed: if Windows says it protected your PC, choose More info, Run anyway). Mac (Apple Silicon, macOS 13 or later): unpack gladius-$VERSION-macos-arm64.tar.xz, move Gladius.app to Applications, and before opening it the first time run xattr -dr com.apple.quarantine \"/Applications/Gladius.app\" in Terminal (it is not signed with an Apple Developer ID). Android (arm64, 11 or later): install gladius-$VERSION-android-arm64.apk, open it and choose your disc image or game folder; it builds the game on the device the first time, in a few minutes. See README.txt inside."
          gh release upload "$VERSION" archives/*.tar.xz archives/*.zip archives/*.apk --clobber
